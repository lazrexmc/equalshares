- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - heading "The Roll Call" [level=1] [ref=e3]
    - paragraph [ref=e4]: Fund proxy votes, per category, with receipts.
    - paragraph [ref=e5]: "Funds that hold voting shares vote them on your behalf: on directors, executive pay, climate reports, mergers, at the company meetings of every stock they hold. Once a year the SEC requires each fund to file the full list of those votes (Form N-PX). It is public, and almost nobody can read it. This page is one such filing made readable: one fund, one proxy year, every vote lot, grouped by the SEC's own categories, with a receipt to the filing for every row."
    - paragraph [ref=e6]: "Fund: Vanguard Morningstar Value Index Fund, a series of VANGUARD INDEX FUNDS (CIK 0000036405) | Form N-PX | proxy year ending 2026-06-30"
    - paragraph [ref=e7]: Filed 2026-08-27 (SEC) | fetched 2026-08-28T18:41:32+00:00 | page generated 2026-08-30T05:02:23+00:00
  - main [ref=e8]:
    - region [ref=e9]:
      - heading "How to read this page" [level=2] [ref=e10]
      - paragraph [ref=e11]: "Terms first; the numbers below are computed from the filing and every one of them can be opened as a list. Four strangers read an earlier version of this page and could not tell what a row was, so:"
      - generic [ref=e12]:
        - term [ref=e13]: Fund
        - definition [ref=e14]:
          - text: The fund named in the line above the page is one
          - emphasis [ref=e15]: series
          - text: of a larger registrant (the trust that files with the SEC). The filing covers that one series and one proxy year.
        - term [ref=e16]: Proxy year
        - definition [ref=e17]: Form N-PX covers votes cast from July 1 to June 30. The period shown is the year's end date.
        - term [ref=e18]: Proposal
        - definition [ref=e19]: "One item on one company's ballot: a director election, a pay plan, a shareholder's climate resolution. The fund's vote on it is what a reader usually wants."
        - term [ref=e20]: Record, or vote lot
        - definition [ref=e21]:
          - text: One row of this page. The filing reports a proposal in one or more blocks, and each block holds one or more
          - emphasis [ref=e22]: lots
          - text: ": a block of shares voted one way, with its own share count. One fund can vote different lots of the same proposal differently; that is the filing's own structure, shown as filed, and it is why a proposal can appear several times. Each row says which lot of how many it is."
        - term [ref=e23]: Category
        - definition [ref=e24]: The SEC's own category, as the fund filed it. This page does not classify anything. A record the fund tagged with several categories is counted under the first one.
        - term [ref=e25]: Proposed by
        - definition [ref=e26]:
          - text: The filing's
          - code [ref=e27]: voteSource
          - text: ":"
          - code [ref=e28]: ISSUER
          - text: means the company's own management put the item forward;
          - code [ref=e29]: SECURITY HOLDER
          - text: means a shareholder did.
        - term [ref=e30]: How voted
        - definition [ref=e31]:
          - text: FOR, AGAINST, ABSTAIN, or WITHHOLD as filed. WITHHOLD is the director-election way of not supporting a nominee where AGAINST is not on the ballot. Anything else the filing put in this field (say-on-pay frequency answers like "ONE YEAR" or "1.0") is shown verbatim and marked
          - emphasis [ref=e32]: unparseable
          - text: ; it is never guessed into one of the four.
        - term [ref=e33]: "% FOR"
        - definition [ref=e34]: Of the lots with a readable vote in that cell, the share voted FOR, with the count beside it. It is split by who proposed the item because "FOR" means support for management on a management item and support for a shareholder on a shareholder item. It says nothing about what any board wanted.
        - term [ref=e35]: Mgmt rec (as filed)
        - definition [ref=e36]:
          - text: The filing's
          - code [ref=e37]: managementRecommendation
          - text: field, reproduced verbatim on each lot. It is a per-lot field, and this page checks whether it behaves like a board's recommendation before resting anything on it; the result of that check is stated in "Where these numbers come from". No headline on this page is computed from it.
        - term [ref=e38]: Unparseable / absent in source
        - definition [ref=e39]:
          - text: "Two different states, never merged:"
          - emphasis [ref=e40]: unparseable
          - text: means the filing gave a value this page does not understand (shown raw);
          - emphasis [ref=e41]: absent in source
          - text: means the filing gave no value at all, for example a proposal filed with zero lots (a withdrawn resolution).
        - term [ref=e42]: Zero-share lots
        - definition [ref=e43]: A lot reported with 0 shares is the fund stating that a voting block held no shares at that meeting. Shown as filed.
        - term [ref=e44]: Receipts
        - definition [ref=e45]: "Form N-PX has no per-row anchor, so there is one receipt per filing: EDGAR's rendered vote table, stored at ingest time, never constructed. Each row tells you where to look in it: the row's position in the filing, its proposal number, and the issuer, CUSIP and meeting date to search for."
        - term [ref=e46]: EqualShares
        - definition [ref=e47]: An independent project that makes fund proxy votes readable. Not affiliated with any fund, registrant, or the SEC. Every number here is computed from the filing by a fingerprinted run; none are typed.
